<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <title>Counsellor Offer Nudge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #10151d;
      color: #f3f5f8;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .toolbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 16px;
      border-bottom: 1px solid #303946;
      background: #171e28;
    }

    .title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .versions {
      display: inline-flex;
      flex: none;
      gap: 4px;
      padding: 3px;
      border: 1px solid #3a4553;
      border-radius: 8px;
      background: #10151d;
    }

    .versions button {
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #bac3cf;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .versions button:hover { color: #fff; background: #273240; }
    .versions button[aria-pressed="true"] { color: #10151d; background: #a8e6cd; }
    .versions button:focus-visible { outline: 2px solid #a8e6cd; outline-offset: 2px; }

    .preview {
      width: 100%;
      min-height: 0;
      flex: 1;
      border: 0;
      background: #fff;
    }

    @media (max-width: 520px) {
      .toolbar { align-items: flex-start; flex-direction: column; gap: 8px; padding: 10px 12px; }
      .versions { width: 100%; }
      .versions button { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1 class="title">Counsellor Offer Nudge</h1>
    <div class="versions" role="group" aria-label="Prototype version">
      <button type="button" data-version="1" aria-pressed="true">Version 1</button>
      <button type="button" data-version="2" aria-pressed="false">Version 2</button>
    </div>
  </header>
  <iframe class="preview" id="preview" src="counsellor-offer-nudge-v1.html" title="Counsellor Offer Nudge, Version 1"></iframe>
  <script>
    const preview = document.getElementById('preview');
    const versionButtons = Array.from(document.querySelectorAll('[data-version]'));

    versionButtons.forEach(button => {
      button.addEventListener('click', () => {
        const version = button.dataset.version;
        const nextVersion = new URL(`counsellor-offer-nudge-v${version}.html`, location.href);
        preview.contentWindow.location.replace(nextVersion.href);
        preview.title = `Counsellor Offer Nudge, Version ${version}`;
        versionButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
