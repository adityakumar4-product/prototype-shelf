<svg viewBox="0 0 390 812" width="390" height="812" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Add New Address screen with city and state filled from pin code 110027">
  <style>
    text{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .lbl{font-size:11px;font-weight:500;fill:#8A8A93}
    .lbl2{font-size:11px;font-weight:500;fill:#6B6B73}
    .val{font-size:15px;font-weight:500;fill:#111113}
    .sec{font-size:15.5px;font-weight:700;fill:#111113}
    .ph{font-size:15px;font-weight:500;fill:#A2A2AA}
  </style>

  <rect width="390" height="812" fill="#FFFFFF"/>

  <!-- status bar -->
  <rect x="26" y="14" width="62" height="22" rx="11" fill="#111113"/>
  <text x="98" y="33" font-size="13" font-weight="600" fill="#111113">7:59</text>
  <rect x="318" y="20" width="16" height="10" rx="2" fill="none" stroke="#111113" stroke-width="1.5"/>
  <rect x="338" y="20" width="3" height="10" rx="1" fill="#111113"/>
  <rect x="345" y="19" width="22" height="11" rx="3" fill="none" stroke="#111113" stroke-width="1.5"/>

  <!-- header -->
  <text x="30" y="80" font-size="24" font-weight="400" fill="#111113">‹</text>
  <text x="66" y="79" font-size="17" font-weight="700" fill="#111113" letter-spacing="-0.17">Add New Address</text>
  <line x1="0" y1="104.5" x2="390" y2="104.5" stroke="#EDEDEF" stroke-width="1"/>

  <!-- Contact Details -->
  <text x="20" y="137" class="sec">Contact Details</text>

  <rect x="20" y="154" width="350" height="46" rx="12" fill="none" stroke="#DFDFE3"/>
  <rect x="27" y="147" width="42" height="10" fill="#FFFFFF"/>
  <text x="36" y="151" class="lbl">Name</text>
  <text x="34" y="182" class="val">Ashpreet Singh</text>

  <rect x="20" y="212" width="350" height="46" rx="12" fill="none" stroke="#DFDFE3"/>
  <rect x="27" y="205" width="88" height="10" fill="#FFFFFF"/>
  <text x="36" y="209" class="lbl">Mobile Number</text>
  <text x="34" y="240" class="val">9717593549</text>

  <!-- Address Details -->
  <text x="20" y="291" class="sec">Address Details</text>

  <!-- pin code -->
  <rect x="20" y="306" width="350" height="44" rx="12" fill="none" stroke="#DFDFE3"/>
  <rect x="27" y="299" width="54" height="10" fill="#FFFFFF"/>
  <text x="36" y="303" class="lbl">Pin Code</text>
  <text x="34" y="333" class="val" letter-spacing="0.6">110027</text>
  <circle cx="347" cy="328" r="9.5" fill="#111113"/>
  <text x="347" y="332" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>

  <!-- house -->
  <rect x="20" y="362" width="350" height="72" rx="12" fill="none" stroke="#DFDFE3"/>
  <rect x="27" y="355" width="184" height="10" fill="#FFFFFF"/>
  <text x="36" y="359" class="lbl">House No., Floor, Street, Locality</text>
  <text x="34" y="390" class="val">J4/47, 2nd Floor, Sector 32</text>

  <!-- locality -->
  <rect x="20" y="446" width="350" height="46" rx="12" fill="none" stroke="#DFDFE3"/>
  <rect x="27" y="439" width="82" height="10" fill="#FFFFFF"/>
  <text x="36" y="443" class="lbl">Locality/Town</text>
  <text x="34" y="474" class="val">Dwarka</text>

  <!-- landmark -->
  <rect x="20" y="504" width="350" height="46" rx="12" fill="none" stroke="#DFDFE3"/>
  <text x="34" y="532" class="ph">Landmark (optional)</text>

  <!-- filled-from-pin group -->
  <rect x="20" y="558" width="350" height="128" rx="14" fill="#F5FAF6" stroke="#CBDFD0"/>
  <rect x="32" y="549" width="166" height="19" rx="9.5" fill="#E7F3EA" stroke="#BCD6C3"/>
  <text x="42" y="562" font-size="11" font-weight="700" fill="#2C6E42">✓</text>
  <text x="55" y="562" font-size="11" font-weight="600" fill="#24522F">Filled from pin code</text>
  <rect x="153" y="552.5" width="41" height="13" rx="5" fill="#2C6E42"/>
  <text x="173" y="562" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.4" text-anchor="middle">110027</text>

  <rect x="32" y="590" width="163" height="44" rx="11" fill="#FFFFFF" stroke="#DCDCE1"/>
  <rect x="38" y="583" width="32" height="10" fill="#FFFFFF"/>
  <text x="47" y="587" class="lbl2">City</text>
  <text x="45" y="617" font-size="15" font-weight="600" fill="#111113">New Delhi</text>

  <rect x="205" y="590" width="163" height="44" rx="11" fill="#FFFFFF" stroke="#DCDCE1"/>
  <rect x="211" y="583" width="38" height="10" fill="#FFFFFF"/>
  <text x="220" y="587" class="lbl2">State</text>
  <text x="218" y="617" font-size="15" font-weight="600" fill="#111113">Delhi</text>

  <text x="34" y="654" font-size="11.5" font-weight="500" fill="#3F6B4A">We filled city and state from Pin Code 110027.</text>
  <text x="34" y="671" font-size="11.5" font-weight="500" fill="#3F6B4A">Update the pin code to change city and state.</text>

  <!-- sticky CTA -->
  <rect x="0" y="716" width="390" height="96" fill="#FFFFFF"/>
  <rect x="0" y="713" width="390" height="4" fill="#111113" opacity="0.035"/>
  <rect x="20" y="733" width="350" height="53" rx="14" fill="#111113"/>
  <text x="195" y="765" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save Address</text>
</svg>
