<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-cmp-id="{{ cmpId }}" style="background:#131418;border-radius:18px;padding:16px 12px 14px">
  <div style="display:flex;align-items:center;gap:8px">
    <div style="flex:1;font:700 17px/1.2 'Source Serif 4',serif;color:#fff">Choose your plan</div>
    <div style="font:700 10px/1 'Plus Jakarta Sans',sans-serif;color:#8DE8B4;background:rgba(61,214,140,.12);padding:5px 7px;border-radius:6px;white-space:nowrap">{{ proof }}</div>
  </div>

  <div style="position:relative;margin-top:12px">
    <div style="position:absolute;top:0;bottom:0;width:62px;right:{{ hiRight }};border:1px solid #4A4F5E;background:#0A0B0E;border-radius:11px;transition:right .24s cubic-bezier(.4,0,.2,1);pointer-events:none"></div>

    <div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 62px;align-items:end;padding:12px 0 10px">
      <div style="font:700 13px/1.2 'Plus Jakarta Sans',sans-serif;color:#fff;padding:0 0 4px 6px">What you get</div>
      <sc-for list="{{ cols }}" as="c" hint-placeholder-count="3">
        <div onClick="{{ c.pick }}" style="text-align:center;padding:0 3px;cursor:pointer">
          <div style="width:22px;height:22px;border-radius:6px;margin:0 auto;background:{{ c.icBg }};color:{{ c.icFg }};font:800 11px/22px 'Plus Jakarta Sans',sans-serif">{{ c.ic }}</div>
          <div style="font:700 10.5px/1.25 'Plus Jakarta Sans',sans-serif;color:{{ c.fg }};margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word">{{ c.name }}</div>
          <div style="font:600 9px/1.2 'Plus Jakarta Sans',sans-serif;color:{{ c.pfg }};margin-top:3px">{{ c.price }}</div>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <sc-if value="{{ r.hasSection }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative;border-top:1px dashed #3A3D47;margin-top:6px;padding:12px 0 3px 6px;font:600 11px/1 'Plus Jakarta Sans',sans-serif;color:#8A90A2">{{ r.section }}</div>
      </sc-if>
      <div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 62px;align-items:center;padding:7px 0;background:{{ r.bg }};border-radius:7px;transition:background .5s ease">
        <div style="display:flex;align-items:center;gap:6px;padding-left:6px;min-width:0">
          <div style="font:{{ r.w }} 12px/1.3 'Plus Jakarta Sans',sans-serif;color:{{ r.fg }}">{{ r.title }}</div>
          <sc-if value="{{ r.info }}" hint-placeholder-val="{{ false }}">
            <div style="flex:0 0 12px;height:12px;border-radius:50%;border:1px solid #5A5F6E;color:#8A90A2;font:700 8px/10px 'Plus Jakarta Sans',sans-serif;text-align:center;box-sizing:border-box">i</div>
          </sc-if>
        </div>
        <div style="text-align:center;font:700 13px/1 'Plus Jakarta Sans',sans-serif;color:{{ r.c0 }}">{{ r.v0 }}</div>
        <div style="text-align:center;font:700 13px/1 'Plus Jakarta Sans',sans-serif;color:{{ r.c1 }}">{{ r.v1 }}</div>
        <div style="text-align:center;font:700 13px/1 'Plus Jakarta Sans',sans-serif;color:{{ r.c2 }}">{{ r.v2 }}</div>
      </div>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:0 6px">
    <div onClick="{{ toggle }}" style="font:700 12px/1 'Plus Jakarta Sans',sans-serif;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer">{{ toggleLabel }}</div>
    <div style="font:600 10px/1 'Plus Jakarta Sans',sans-serif;color:#7A8093">{{ countLabel }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:366,&quot;height&quot;:620},&quot;plan&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;names&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:number)=&gt;void&quot;}}">
// [title, basic, mid, top, section(0|1|2|null), info]
const ROWS = [
  ["Live & recorded lectures", 1, 1, 1, null, false],
  ["Community access", 1, 1, 1, null, false],
  ["DPPs and tests", 1, 1, 1, null, false],
  ["Notes & revision classes", 1, 1, 1, null, false],
  ["Khazaana", 0, 1, 1, 1, true],
  ["Sahayak", 0, 1, 1, null, true],
  ["Online test series", 0, 1, 1, null, false],
  ["Books", 0, 1, 1, null, false],
  ["PW goodies kit", 0, 1, 1, null, false],
  ["Saarthi", 0, 0, 1, 2, true],
  ["1:1 mentorship", 0, 0, 1, null, false],
  ["Offline test series", 0, 0, 1, null, false],
  ["Test Pass", 0, 0, 1, null, true]
];
const PRICES = ["₹4,999", "₹9,600", "₹20,600"];
const ICONS = [["B", "#2C4A8A", "#BFD4FF"], ["∞", "#0F4D35", "#5BE3A4"], ["★", "#5A430F", "#F5C64B"]];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flash: false, open: false };
    this.cid = "pt" + Math.random().toString(36).slice(2, 8);
  }

  componentDidUpdate(prev) {
    if (prev.plan !== this.props.plan) {
      clearTimeout(this._t);
      this.setState({ flash: true });
      this._t = setTimeout(() => this.setState({ flash: false }), 1600);
    }
  }

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const p = this.props.plan ?? 1;
    const N = this.props.names || ["Basic", "Infinity", "Infinity Pro"];
    const owns = (a, b, c) => p === 0 ? a === 1 : p === 1 ? (a === 0 && b === 1) : (b === 0 && c === 1);
    const sel = (n) => () => this.props.onSelect && this.props.onSelect(n);

    const cols = N.map((name, i) => ({
      name, price: PRICES[i], pick: sel(i), ic: ICONS[i][0],
      icBg: ICONS[i][1], icFg: ICONS[i][2],
      fg: p === i ? "#F5C64B" : "#9AA0B4",
      pfg: p === i ? "#C9CEDC" : "#5F6678"
    }));

    const COLLAPSED = [0, 2, 4, 5, 9];
    const src = this.state.open ? ROWS : ROWS.filter((_, i) => COLLAPSED.includes(i));
    const rows = src.map(([title, a, b, c, sec, info]) => {
      const vals = [a, b, c];
      const mark = (i) => {
        const on = i === p;
        return vals[i] ? { v: "✓", c: on ? "#3DD68C" : "#2C8A5E" } : { v: "✕", c: on ? "#FF6B6B" : "#8A3E3E" };
      };
      const m0 = mark(0), m1 = mark(1), m2 = mark(2);
      const mine = owns(a, b, c);
      return {
        title, info,
        hasSection: sec !== null && sec > 0,
        section: sec ? N[sec] + " features" : "",
        w: info ? "700" : "500",
        fg: info ? "#fff" : "#D8DBE4",
        bg: mine && this.state.flash ? "rgba(245,198,75,.08)" : "transparent",
        v0: m0.v, c0: m0.c, v1: m1.v, c1: m1.c, v2: m2.v, c2: m2.c
      };
    });

    const deltas = [
      { t: "Add " + N[1] + " for ₹384/month more", s: "Khazaana, Sahayak, test series & books", c: "Upgrade", to: 1 },
      { t: "Go " + N[2] + " for ₹917/month more", s: "Saarthi, 1:1 mentorship & offline tests", c: "Upgrade", to: 2 },
      { t: "You're on the most complete plan", s: "Everything this batch offers is included", c: "Selected", to: 2 }
    ][p];

    return {
      cmpId: this.cid, cols, rows,
      hiRight: [124, 62, 0][p] + "px",
      proof: "35k+ chose " + N[1],
      toggle: () => this.setState(s => ({ open: !s.open })),
      toggleLabel: this.state.open ? "Show fewer items" : "Show all plan items",
      countLabel: this.state.open ? ROWS.length + " items" : COLLAPSED.length + " of " + ROWS.length + " items"
    };
  }
}
</script>
</body>
</html>
