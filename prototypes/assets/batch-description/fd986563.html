<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:10px 12px 0">
  <div style="background:#fff;border-radius:18px;box-shadow:0 8px 26px rgba(15,17,22,.09);padding:14px">
    <div style="display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:start">
      <div>
        <div style="display:flex;gap:5px">
          <div style="font:700 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.05em;color:#2C3040;border:1px solid #DDE0EA;padding:4px 7px;border-radius:6px">HINGLISH</div>
          <div style="font:700 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.05em;color:#8A5A12;background:#FDF0D8;padding:4px 7px;border-radius:6px">LEGENDARY</div>
        </div>
        <div style="font:700 20px/1.15 'Source Serif 4',serif;color:#0B0D12;letter-spacing:-.01em;margin-top:9px">Yakeen NEET 2.0 2026</div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:9px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex:0 0 14px"><circle cx="8" cy="8" r="7" fill="#E23B3B"></circle><circle cx="8" cy="8" r="4" fill="#fff"></circle><circle cx="8" cy="8" r="1.6" fill="#E23B3B"></circle></svg>
          <div style="font:700 11px/1.2 'Plus Jakarta Sans',sans-serif;color:#2C3040">NEET · May 2026 attempt</div>
        </div>
      </div>

      <div onClick="{{ topDemo }}" style="position:relative;height:108px;border-radius:14px;background:linear-gradient(165deg,#FBEBAF 0%,#F5D46B 100%);overflow:hidden;cursor:pointer">
        <div style="position:absolute;inset:8px;border-radius:10px;border:1.5px dashed rgba(120,88,10,.38);display:flex;align-items:center;justify-content:center">
          <div style="font:700 9px/1.3 'Plus Jakarta Sans',sans-serif;color:rgba(104,76,8,.72);text-align:center;letter-spacing:.03em">FACULTY<br/>PHOTO</div>
        </div>
        <div style="position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;background:rgba(15,17,22,.86);padding:4px 7px;border-radius:20px;font:700 8px/1 'Plus Jakarta Sans',sans-serif;color:#fff;letter-spacing:.04em"><span style="font-size:7px">▶</span>DEMO</div>
      </div>
    </div>

    <div onClick="{{ teachers }}" style="display:flex;align-items:center;gap:8px;margin-top:11px;padding:9px 10px;background:#F7F8FC;border-radius:11px;cursor:pointer">
      <div style="flex:1;font:700 11px/1.3 'Plus Jakarta Sans',sans-serif;color:#0B0D12">5 teachers · 3 free demo classes</div>
      <div style="font:700 11px/1 'Plus Jakarta Sans',sans-serif;color:#5A4FCF">View teachers ›</div>
    </div>

    <div style="margin-top:12px;border:1px solid #EDEEF3;border-radius:12px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#F2F3F7">
        <div style="background:#fff;padding:9px 11px;display:flex;align-items:center;gap:7px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex:0 0 14px"><rect x="1.5" y="3" width="13" height="11.5" rx="2" fill="#5A4FCF"></rect><rect x="1.5" y="3" width="13" height="3.4" rx="1.6" fill="#3E349F"></rect><rect x="4" y="1.4" width="1.6" height="3" rx="0.8" fill="#3E349F"></rect><rect x="10.4" y="1.4" width="1.6" height="3" rx="0.8" fill="#3E349F"></rect></svg>
          <div>
            <div style="font:600 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;color:#8A90A2">STARTS ON</div>
            <div style="font:700 11px/1.2 'Plus Jakarta Sans',sans-serif;color:#0B0D12;margin-top:3px">24 Jul '25</div>
          </div>
        </div>
        <div style="background:#fff;padding:9px 11px;display:flex;align-items:center;gap:7px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex:0 0 14px"><rect x="1.5" y="3" width="13" height="11.5" rx="2" fill="#B7BCCB"></rect><rect x="1.5" y="3" width="13" height="3.4" rx="1.6" fill="#8A90A2"></rect><rect x="4" y="1.4" width="1.6" height="3" rx="0.8" fill="#8A90A2"></rect><rect x="10.4" y="1.4" width="1.6" height="3" rx="0.8" fill="#8A90A2"></rect></svg>
          <div>
            <div style="font:600 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;color:#8A90A2">ENDS ON</div>
            <div style="font:700 11px/1.2 'Plus Jakarta Sans',sans-serif;color:#0B0D12;margin-top:3px">24 Jan '26</div>
          </div>
        </div>
        <div style="background:#fff;padding:9px 11px;display:flex;align-items:center;gap:7px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex:0 0 14px"><circle cx="8" cy="8.6" r="6.4" fill="#1B9C64"></circle><path d="M5.2 8.8l1.9 1.9 3.7-3.9" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
          <div>
            <div style="font:600 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;color:#8A90A2">SYLLABUS DONE BY</div>
            <div style="font:700 11px/1.2 'Plus Jakarta Sans',sans-serif;color:#0B0D12;margin-top:3px">24 Oct '25</div>
          </div>
        </div>
        <div style="background:#fff;padding:9px 11px;display:flex;align-items:center;gap:7px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex:0 0 14px"><path d="M13.4 8a5.4 5.4 0 1 1-1.9-4.1" stroke="#B0670F" stroke-width="1.8" stroke-linecap="round" fill="none"></path><path d="M13.6 2.2v3.1h-3.1" stroke="#B0670F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
          <div>
            <div style="font:600 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;color:#8A90A2">REVISION PERIOD</div>
            <div style="font:700 11px/1.2 'Plus Jakarta Sans',sans-serif;color:#B0670F;margin-top:3px">3 months</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:300},&quot;onTeachers&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onDemo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(d:object)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      teachers: () => this.props.onTeachers && this.props.onTeachers(),
      topDemo: () => this.props.onDemo && this.props.onDemo({ teacher: "Manish Raj Sir", topic: "Electric Charges & Fields · Lecture 01" })
    };
  }
}
</script>
</body>
</html>
